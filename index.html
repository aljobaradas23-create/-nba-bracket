<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bracket">
<meta name="application-name" content="Bracket">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Playoff Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--line:rgba(255,255,255,.16);--tx:#f3f5f9;--mut:#9aa4b8;--gold:#f4c64e;--gap:26px;--stub:13px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#04060b;overscroll-behavior:none}
body{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:var(--tx);min-height:100vh;
  background:
    radial-gradient(70% 55% at -5% 30%, rgba(200,16,46,.6), transparent 70%),
    radial-gradient(70% 55% at 105% 30%, rgba(29,91,191,.65), transparent 70%),
    radial-gradient(50% 30% at 50% 0%, rgba(255,255,255,.12), transparent 75%),
    repeating-radial-gradient(circle at 50% 135%, rgba(255,255,255,.035) 0 1.5px, transparent 1.5px 7px),
    #04060b;background-attachment:fixed}
button,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior:none}
@media (display-mode: standalone){ header{padding-top:12px} .kick{display:none} }
.sd{display:flex;flex-direction:column;justify-content:center;line-height:1}
.sd b{font-weight:800}
.sd i{font-style:normal;font-weight:700;font-size:11px;color:#aab3c4;letter-spacing:.04em;margin-top:2px}
.panel.E .sd{align-items:flex-end}
.editor{max-width:980px;margin:6px auto 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ecol{background:rgba(8,11,20,.82);border:1px solid var(--line);border-radius:14px;padding:12px}
.ecol h3{font-weight:900;font-style:italic;font-size:20px;margin-bottom:8px}
.ecol.W h3{text-shadow:0 0 18px rgba(200,16,46,.9)} .ecol.E h3{text-shadow:0 0 18px rgba(29,91,191,.9)}
.er{display:grid;grid-template-columns:24px 44px minmax(0,1fr) 44px 44px 38px 30px;gap:5px;align-items:center;margin-top:5px}
.er.out{opacity:.62}
.etn{font-weight:800;font-style:italic;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep{font-weight:700;font-size:14px;color:#c9d0dc;text-align:center}
.pline{margin:8px 0 2px;border-top:1.5px dashed rgba(244,198,78,.7);font-weight:800;font-size:10px;letter-spacing:.2em;color:var(--gold);text-align:center;padding-top:3px}
.er .en{font-weight:900;font-style:italic;font-size:15px;color:#fff;text-align:center}
.er.in .en{color:var(--gold)}
.er .tile{width:46px;height:30px;font-size:15px}
.er input{width:100%;min-width:0;background:#070a12;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:7px 2px;font-weight:700;font-size:16px;color:#fff;-moz-appearance:textfield}
.er input::-webkit-outer-spin-button,.er input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.er input{text-align:center}
.er em{font-style:normal;color:var(--mut);text-align:center;font-weight:800}
.ehead{display:grid;grid-template-columns:24px 44px minmax(0,1fr) 44px 44px 38px 30px;gap:5px;font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--mut)}
.ehead span:nth-child(n+4){text-align:center}
.eact{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
@media (max-width:700px){ .editor{grid-template-columns:1fr} }

header{text-align:center;padding:24px 14px 10px}
.kick{font-weight:700;letter-spacing:.35em;font-size:12px;color:#c7cfdd}
h1{font-weight:900;font-style:italic;font-size:64px;line-height:.92;text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.6)}
h1 .pw{background:linear-gradient(180deg,#fff 40%,#c9d0dc);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 #yh{color:var(--gold)}
.sub{color:#b5bdcc;font-size:15px;font-weight:600;letter-spacing:.06em;margin-top:2px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px auto 0;max-width:900px}
.ctl label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--mut);background:rgba(10,14,24,.8);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 10px}
.ctl select{background:#070a12;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:700;font-size:16px;color:#fff}
.btn{font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:10px;background:rgba(10,14,24,.8);border:1px solid var(--line)}
.btn:hover{border-color:#fff}
.btn.on{background:#fff;color:#0a0d16;border-color:#fff}
.hint{font-size:13px;color:#aab3c4;letter-spacing:.04em;margin-top:10px}

main{max-width:1500px;margin:0 auto;padding:6px 12px 40px}
.bscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:6px 12px 8px}
.bscroll.fit{overflow:hidden}
.bscroll.fit .bwrap{transform-origin:0 0}
.bwrap{display:grid;grid-template-columns:minmax(0,1fr) 250px minmax(0,1fr);gap:24px;align-items:start;min-width:1320px}
.ph h2{font-weight:900;font-style:italic;font-size:30px;line-height:.9;color:#fff}
.panel.W .ph h2{text-shadow:0 0 28px rgba(200,16,46,.8)}
.panel.E .ph h2{text-shadow:0 0 28px rgba(29,91,191,.9)}
.panel.E .ph{text-align:right}
.rlabels{display:flex;gap:var(--gap);margin:14px 0 2px}
.rlabels span{flex:1 1 0;min-width:0;text-align:center;font-weight:800;font-style:italic;font-size:12px;letter-spacing:.12em;color:#e8ecf3;text-transform:uppercase}
.rounds{display:flex;gap:var(--gap);align-items:stretch}
.panel.E .rounds,.panel.E .rlabels{flex-direction:row-reverse}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-around}
.pair{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.pair::after{content:"";position:absolute;top:25%;bottom:25%;right:calc(-1 * var(--stub));width:var(--stub);border:1.5px solid rgba(255,255,255,.55);border-left:0;pointer-events:none}
.pair::before{content:"";position:absolute;top:50%;right:calc(-1 * var(--gap));width:calc(var(--gap) - var(--stub));border-top:1.5px solid rgba(255,255,255,.55);pointer-events:none}
.panel.E .pair::after{right:auto;left:calc(-1 * var(--stub));border-left:1.5px solid rgba(255,255,255,.55);border-right:0}
.panel.E .pair::before{right:auto;left:calc(-1 * var(--gap))}

.mu{margin:12px 0}
.team{width:100%;display:flex;align-items:center;gap:8px;height:42px;padding:3px 10px 3px 3px;border-radius:6px;text-align:left;
  background:linear-gradient(180deg, rgba(30,36,54,.92), rgba(12,15,26,.92));border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.45);transition:opacity .2s, transform .1s}
.team+.team{margin-top:6px}
button.team:active{transform:scale(.98)}
.tile{flex:none;width:52px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg, color-mix(in srgb, var(--tc) 70%, #fff 30%) 0%, var(--tc) 45%, color-mix(in srgb, var(--tc) 65%, #000) 100%);
  border-bottom:3px solid var(--ts);font-weight:900;font-style:italic;font-size:18px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.sd{flex:1;min-width:0;font-weight:800;font-style:italic;font-size:15px;letter-spacing:.04em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn{flex:none;min-width:22px;text-align:right;font-weight:900;font-style:italic;font-size:24px;color:#fff;border-radius:5px}
.wn.ed{min-width:30px;height:30px;line-height:30px;text-align:center;background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.35);border-radius:6px;padding:0 4px;cursor:pointer}
.wn.ed.top{background:rgba(255,255,255,.16);border-style:solid;border-color:rgba(255,255,255,.6)}
.team.live{border-color:rgba(244,198,78,.55)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet[hidden]{display:none}
.sheet-card{width:100%;max-width:400px;background:linear-gradient(180deg,#121828,#080b14);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.sh-t{font-weight:900;font-style:italic;font-size:26px;text-transform:uppercase}
.sh-s{color:var(--mut);font-weight:700;font-size:13px;letter-spacing:.08em;margin-bottom:10px}
.srow2{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-top:8px}
.srow2.w{border-color:var(--gold);background:rgba(244,198,78,.1)}
.snm{flex:1;min-width:0;font-weight:700;font-size:13px;color:#c9d0dc;line-height:1.1}
.snm b{font-weight:900;font-style:italic;font-size:19px;color:#fff}
.stp{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);font-weight:900;font-size:24px;line-height:1}
.stp:disabled{opacity:.3}
.snum{min-width:34px;text-align:center;font-weight:900;font-style:italic;font-size:34px}
.sh-st{text-align:center;font-weight:800;font-size:16px;color:var(--gold);margin:12px 0 4px}
.sh-b{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.team.win{background:linear-gradient(180deg, rgba(50,58,84,.96), rgba(18,22,36,.96));border-color:rgba(255,255,255,.6)}
.team.lose{opacity:.45}

.team.tbd{opacity:.5}
.team.tbd .tile{background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.2)}
.tbdtxt{flex:1;font-weight:700;font-style:italic;font-size:12px;color:#7d889e}
.panel.E .team{flex-direction:row-reverse;padding:3px 3px 3px 10px}
.panel.E .sd{text-align:right}
.panel.E .wn{text-align:left}
.team select{flex:1;min-width:0;background:#070a12;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 4px;font-weight:700;font-size:14px;color:#fff}

.panel.F{align-self:center}
.ph.fin{text-align:center}
.ph.fin h2{font-size:56px;display:flex;flex-direction:column;align-items:center;line-height:.85;text-shadow:0 0 30px rgba(244,198,78,.45)}
.ph.fin h2 small{font-size:16px;letter-spacing:.3em;color:var(--gold);font-style:normal;font-weight:800}
.fmu .team{height:48px}
.fmu .tile{width:60px;height:38px;font-size:20px}
.fmu .rl{text-align:center;font-weight:800;font-style:italic;font-size:12px;letter-spacing:.14em;color:#e8ecf3;margin:14px 0 6px}
.trophy{margin-top:18px;text-align:center;padding:18px 10px 16px;border-radius:14px;border:1px solid rgba(244,198,78,.3);background:radial-gradient(60% 55% at 50% 35%, rgba(244,198,78,.16), rgba(6,8,14,.75) 72%)}
.trophy.on{border-color:var(--gold);background:radial-gradient(60% 55% at 50% 35%, color-mix(in srgb, var(--tc) 55%, transparent), rgba(6,8,14,.85) 75%);box-shadow:0 0 40px rgba(244,198,78,.2)}
.trophy .tro{display:block;margin:0 auto;height:200px;width:auto;filter:drop-shadow(0 12px 20px rgba(0,0,0,.6))}
.trophy:not(.on) .tro{opacity:.6;filter:grayscale(.45) drop-shadow(0 12px 20px rgba(0,0,0,.6))}
.ck{font-weight:800;font-size:12px;letter-spacing:.24em;color:var(--gold);margin-top:8px}
.cn{font-weight:900;font-style:italic;font-size:30px;line-height:1;margin-top:4px}
.cc{font-weight:700;font-size:15px;color:#c9d0dc;margin-top:4px}
.cq{font-weight:700;font-style:italic;font-size:16px;color:#8f9ab0;margin-top:6px}
@media (max-width:480px){ h1{font-size:46px} .ph h2{font-size:24px} }
@media (min-width:1280px){ .bwrap{min-width:0} .bscroll{overflow:visible} .fitbtn{display:none} }
</style>
</head>
<body>

  <div class="kick">FAN BRACKET</div>

    <button class="btn fitbtn" id="fit">Full View</button>
  </div>
  <div class="hint" id="hint"></div>
</header>
<div class="sheet" id="sheet" hidden></div>
<main><div class="editor" id="editor" hidden></div><div class="bscroll" id="bscroll"><div class="bwrap" id="bwrap"></div></div></main>

const KEY = 'nba-bracket-only-v1';
const NOW = YEARS[0];
const season = y => `${y-1}–${String(y).slice(2)}`;
const esc = s => String(s==null ? '' : s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const AB = id => TEAMS[id].a || id;
const ORD = n => n + (n%100>=11 && n%100<=13 ? 'TH' : ({1:'ST',2:'ND',3:'RD'}[n%10] || 'TH'));
let state = (()=>{ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.data && YEARS.includes(s.year)) return s; }catch(e){} return {year:NOW, fmt:'7', data:{}, fit:null, edit:false}; })();
if(state.fit==null) state.fit = innerWidth < 1280;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function cur(){
  const y = state.year;
  if(!state.data[y]) state.data[y] = {};
  const d = state.data[y];
  if(!d.seeds) d.seeds = {W:HIST[y].W.slice(0,8), E:HIST[y].E.slice(0,8)};
  if(!d.picks) d.picks = {};
  if(!d.rec) d.rec = {};
  return d;
}
const recOf = id => { const d = cur(); return d.rec[id] != null ? d.rec[id] : ((REC[state.year] || {})[id] || ''); };
const pct = r => { const [w, l] = String(r).split('-').map(Number); return (w+l) ? w/(w+l) : -1; };
const need = () => state.fmt==='5' ? 3 : 4;

/* ================= BRACKET LOGIC ================= */
const KEYS = ['WR1A','WR1B','WR1C','WR1D','ER1A','ER1B','ER1C','ER1D','WR2A','WR2B','ER2A','ER2B','WCF','ECF','F'];
const S = (c, n) => cur().seeds[c][n-1];
/* a pick holds the series score: {s:{TEAM:wins, TEAM:wins}, w:winner once someone reaches 4 (or 3)} */
function normPick(k){
  const P = cur().picks, p = P[k]; if(!p) return null;
  if(!p.s){ const t = parts(k); p.s = {}; if(p.w){ p.s[p.w] = need(); const o = t.find(x=>x && x!==p.w); if(o) p.s[o] = Math.min(p.lw||0, need()-1); } delete p.lw; }
  const ids = Object.keys(p.s);
  ids.forEach(id=>{ p.s[id] = Math.max(0, Math.min(need(), p.s[id]|0)); });
  const done = ids.filter(id=>p.s[id]===need());
  if(done.length>1){ const keep = p.w && done.includes(p.w) ? p.w : done[0]; done.forEach(id=>{ if(id!==keep) p.s[id] = need()-1; }); }
  p.w = ids.find(id=>p.s[id]===need()) || null;
  if(!p.w && ids.every(id=>!p.s[id])){ delete P[k]; return null; }
  return p;
}
const W = k => { const p = normPick(k); return p && p.w ? p.w : null; };
function parts(k){
  if(k==='F') return [W('WCF'), W('ECF')];
  const c = k[0], r = k.slice(1);
  switch(r){
    case 'R1A': return [S(c,1), S(c,8)];
    case 'R1B': return [S(c,4), S(c,5)];
    case 'R1C': return [S(c,3), S(c,6)];
    case 'R1D': return [S(c,2), S(c,7)];
    case 'R2A': return [W(c+'R1A'), W(c+'R1B')];
    case 'R2B': return [W(c+'R1C'), W(c+'R1D')];
    case 'CF':  return [W(c+'R2A'), W(c+'R2B')];
  }
  return [null, null];
}
function resolve(){
  const P = cur().picks;
  for(const k of KEYS){
    const p = normPick(k); if(!p) continue;
    const t = parts(k);
    if(!t[0] || !t[1] || Object.keys(p.s).some(id=>!t.includes(id))) delete P[k];
  }
}
function seedOf(id){ const d = cur(); for(const c of ['W','E']){ const i = d.seeds[c].indexOf(id); if(i>=0) return {c, s:i+1}; } return {c:'', s:0}; }

const TROPHY = `<img class="tro" src="${TROPHY_SRC}" alt="Trophy">`;

/* ================= RENDER ================= */
function winsCell(k, id, p){
  const t = parts(k); if(!t[0] || !t[1]) return `<span class="wn"></span>`;
  const n = p && p.s ? (p.s[id] || 0) : '';
  return `<span class="wn ed ${p && p.w===id ? 'top' : ''}" data-sc="${k}" title="Edit series score">${n}</span>`;
}
function slot(k, id, i, hint){
  const d = cur();
  if(!id) return `<div class="team tbd"><span class="tile"></span><span class="tbdtxt">${hint||''}</span><span class="wn"></span></div>`;
  const p = normPick(k), T = TEAMS[id], sd = seedOf(id);
  const cls = p && p.w ? (p.w===id ? 'win' : 'lose') : (p ? 'live' : '');
  return `<button class="team ${cls}" data-k="${k}" data-t="${id}" style="--tc:${T.p};--ts:${T.s}" title="${esc(T.c+' '+T.n)}" aria-label="${esc(T.c+' '+T.n)}">
    <span class="tile">${AB(id)}</span><span class="sd"><b>${sd.s ? ORD(sd.s) : ''}</b>${recOf(id) ? `<i>${esc(recOf(id))}</i>` : ''}</span>${winsCell(k, id, p)}</button>`;
}
function matchup(k, hints){ const t = parts(k); hints = hints || []; return `<div class="mu">${slot(k, t[0], 0, hints[0])}${slot(k, t[1], 1, hints[1])}</div>`; }
function confPanel(c){
  return `<section class="panel ${c}">
    <div class="ph"><h2>${c==='W' ? 'WESTERN' : 'EASTERN'}<br>CONFERENCE</h2></div>
    <div class="rlabels"><span>First Round</span><span>Conf. Semifinals</span><span>Conf. Finals</span></div>
    <div class="rounds">
      <div class="col"><div class="pair">${matchup(c+'R1A')}${matchup(c+'R1B')}</div><div class="pair">${matchup(c+'R1C')}${matchup(c+'R1D')}</div></div>
      <div class="col"><div class="pair">${matchup(c+'R2A')}${matchup(c+'R2B')}</div></div>
      <div class="col">${matchup(c+'CF')}</div>
    </div></section>`;
}
function finalsPanel(){
  const p0 = normPick('F'), p = p0 && p0.w ? p0 : null, y = state.year;
  let box;
  if(p){
    const T = TEAMS[p.w], l = parts('F').find(t=>t!==p.w);
    box = `<div class="trophy on" style="--tc:${T.p}">${TROPHY}<div class="ck">${y} CHAMPIONS</div><div class="cn">${esc(T.c)}<br>${esc(T.n)}</div><div class="cc">def. ${esc(TEAMS[l].n)} ${p.s[p.w]}-${p.s[l]||0}</div></div>`;
  } else box = `<div class="trophy">${TROPHY}<div class="ck">${y} CHAMPIONS</div><div class="cq">Who's lifting the trophy?</div></div>`;
  return `<section class="panel F"><div class="ph fin"><h2><small>${y}</small>Finals</h2></div>
    <div class="fmu"><div class="rl">THE FINALS</div>${matchup('F', ['West champion','East champion'])}</div>${box}</section>`;
}
/* ---------- full conference standings (user-edited) ---------- */
const wOf = r => parseInt(String(r).split('-')[0], 10) || 0;
const lOf = r => parseInt(String(r).split('-')[1], 10) || 0;
function standings(c){
  const y = state.year, list = confTeams(c).filter(id=>TEAMS[id]);
  return list.map((id, i)=>({id, i, r: recOf(id)})).sort((A, B)=>{
    const pa = pct(A.r), pb = pct(B.r); if(pb!==pa) return pb-pa;
    if(wOf(B.r)!==wOf(A.r)) return wOf(B.r)-wOf(A.r);
    const sa = cur().seeds[c].indexOf(A.id), sb = cur().seeds[c].indexOf(B.id);
    return (sa<0 ? 99 : sa) - (sb<0 ? 99 : sb) || A.i - B.i;
  });
}
function editorHTML(){
  const col = c => {
    const rows = standings(c), top = rows[0] ? rows[0].r : '0-0';
    const gb = r => { const g = ((wOf(top)-wOf(r)) + (lOf(r)-lOf(top)))/2; return g<=0 ? '—' : (g%1 ? g.toFixed(1) : String(g)); };
    return `<div class="ecol ${c}"><h3>${c==='W' ? 'WESTERN' : 'EASTERN'} CONFERENCE</h3>
      <div class="ehead"><span>#</span><span></span><span>TEAM</span><span>W</span><span>L</span><span>PCT</span><span>GB</span></div>
      ${rows.map((x, i)=>{ const T = TEAMS[x.id], has = String(x.r).includes('-');
        return `${i===8 ? '<div class="pline">PLAYOFF LINE</div>' : ''}<div class="er ${i<8 ? 'in' : 'out'}"><span class="en">${i+1}</span><span class="tile" style="--tc:${T.p};--ts:${T.s}">${AB(x.id)}</span>
          <span class="etn">${esc(T.n)}</span>
          <input type="number" inputmode="numeric" min="0" max="99" data-rec="${x.id}" data-f="w" value="${has ? wOf(x.r) : ''}" aria-label="${esc(T.n)} wins">
          <input type="number" inputmode="numeric" min="0" max="99" data-rec="${x.id}" data-f="l" value="${has ? lOf(x.r) : ''}" aria-label="${esc(T.n)} losses">
          <span class="ep">${has && pct(x.r)>=0 ? pct(x.r).toFixed(3).replace(/^0/,'') : '—'}</span><span class="ep">${has ? gb(x.r) : '—'}</span></div>`; }).join('')}
    </div>`;
  };
  return col('W') + col('E') + `<div class="eact"><button class="btn on" id="done">Done</button></div>`;
}
function reseed(){ const d = cur(); for(const c of ['W','E']) d.seeds[c] = standings(c).slice(0, 8).map(x=>x.id); }
const ROUND = k => k==='F' ? 'NBA Finals' : (k.slice(1)==='CF' ? (k[0]==='W' ? 'West Finals' : 'East Finals') : k.includes('R2') ? 'Conference Semifinals' : 'First Round');
let sheetK = null;
function sheetHTML(k){
  const t = parts(k), p = normPick(k), s = p ? p.s : {};
  const row = id => { const T = TEAMS[id], n = s[id] || 0;
    return `<div class="srow2 ${p && p.w===id ? 'w' : ''}"><span class="tile" style="--tc:${T.p};--ts:${T.s}">${AB(id)}</span><span class="snm">${esc(T.c)}<br><b>${esc(T.n)}</b></span>
      <button class="stp" data-step="${id}" data-d="-1" ${n<=0?'disabled':''} aria-label="One less win">−</button><span class="snum">${n}</span><button class="stp" data-step="${id}" data-d="1" ${n>=need()?'disabled':''} aria-label="One more win">+</button></div>`; };
  const a = s[t[0]] || 0, b = s[t[1]] || 0;
  const status = p && p.w ? `${TEAMS[p.w].n} win the series ${s[p.w]}-${s[p.w===t[0]?t[1]:t[0]]||0}` : (a===b ? (a ? `Series tied ${a}-${b}` : 'Not started') : `${TEAMS[a>b?t[0]:t[1]].n} lead ${Math.max(a,b)}-${Math.min(a,b)}`);
  return `<div class="sheet-card" role="dialog" aria-label="Series score"><div class="sh-t">${ROUND(k)}</div><div class="sh-s">First to ${need()} wins advances</div>
    ${row(t[0])}${row(t[1])}<div class="sh-st">${status}</div>
    <div class="sh-b"><button class="btn" data-sheet="clear">Clear</button><button class="btn on" data-sheet="done">Done</button></div></div>`;
}
function openSheet(k){ const t = parts(k); if(!t[0] || !t[1]) return; sheetK = k; const el = document.getElementById('sheet'); el.innerHTML = sheetHTML(k); el.hidden = false; }
function closeSheet(){ sheetK = null; const el = document.getElementById('sheet'); el.hidden = true; el.innerHTML = ''; render(); }
function stepScore(id, dlt){
  const P = cur().picks, k = sheetK, t = parts(k);
  let p = normPick(k); if(!p) p = P[k] = {s:{}};
  t.forEach(x=>{ if(p.s[x]==null) p.s[x] = 0; });
  const o = t.find(x=>x!==id);
  p.s[id] = Math.max(0, Math.min(need(), p.s[id] + dlt));
  if(p.s[id]===need() && p.s[o]===need()) p.s[o] = need()-1;
  p.w = p.s[id]===need() ? id : (p.s[o]===need() ? o : null);
  if(!p.w && !p.s[id] && !p.s[o]) delete P[k];
  resolve(); save();
  document.getElementById('sheet').innerHTML = sheetHTML(k);
}
function rollSeeding(){
  const d = cur(), y = state.year, G = {1999:50, 2012:66}[y] || 82;
  const rn = () => { let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  for(const c of ['W','E']) confTeams(c).forEach(id=>{ const w = Math.max(Math.round(G*.15), Math.min(Math.round(G*.85), Math.round(G/2 + rn()*G*.15))); d.rec[id] = `${w}-${G-w}`; });
  d.picks = {}; reseed(); render();
}
function applyFit(){
  const bs = document.getElementById('bscroll'), bw = document.getElementById('bwrap'), fb = document.getElementById('fit');
  const on = !!state.fit && !state.edit && innerWidth < 1280;
  bs.classList.toggle('fit', on); fb.textContent = state.fit ? 'Zoom In' : 'Full View'; fb.classList.toggle('on', !!state.fit);
  bw.style.transform = ''; bs.style.height = '';
  if(!on) return;
  bs.scrollLeft = 0;
  const cs = getComputedStyle(bs), avail = bs.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const s = Math.min(1, avail / Math.max(bw.offsetWidth, bw.scrollWidth));
  bw.style.transform = `scale(${s})`; bs.style.height = Math.ceil(bw.offsetHeight*s) + 14 + 'px';
}
function render(keepEditor){
  cur(); resolve();
  const y = state.year;
  document.getElementById('yh').textContent = y;
  document.getElementById('sub').textContent = `${season(+y)} season`;
  const sel = document.getElementById('year');
  if(!sel.options.length) sel.innerHTML = YEARS.map(v=>`<option value="${v}">${v}</option>`).join('');
  sel.value = y;
  document.getElementById('fmt').value = state.fmt;
  document.getElementById('edit').textContent = state.edit ? 'Close Standings' : 'Standings';
  document.getElementById('edit').classList.toggle('on', !!state.edit);
  document.getElementById('hint').textContent = state.edit
    ? 'Type each team’s wins and losses. The table re-ranks itself, and the top 8 in each conference go into the bracket.'
    : 'Tap a team to send it to the next round, or tap a score box to set the series score (e.g. 4-2).';
  const ed = document.getElementById('editor'); ed.hidden = !state.edit; if(!keepEditor) ed.innerHTML = state.edit ? editorHTML() : '';
  document.getElementById('bwrap').innerHTML = confPanel('W') + finalsPanel() + confPanel('E');
  applyFit(); save();
}

/* ================= EVENTS ================= */
document.addEventListener('click', e=>{
  if(e.target.closest('#done')){ state.edit = false; render(); return; }
  const stp = e.target.closest('[data-step]');
  if(stp){ stepScore(stp.dataset.step, +stp.dataset.d); return; }
  const shb = e.target.closest('[data-sheet]');
  if(shb){ if(shb.dataset.sheet==='clear') delete cur().picks[sheetK]; resolve(); closeSheet(); return; }
  if(e.target.id==='sheet'){ closeSheet(); return; }
  const scb = e.target.closest('[data-sc]');
  if(scb){ e.preventDefault(); openSheet(scb.dataset.sc); return; }
  const t = e.target.closest('button.team[data-k]');
  if(t){
    const k = t.dataset.k, id = t.dataset.t, P = cur().picks, pr = parts(k);
    if(!pr[0] || !pr[1]) return;
    const cp = normPick(k);
    if(cp && cp.w===id) delete P[k];
    else { const o = pr.find(x=>x!==id), prev = cp ? cp.s : {}; P[k] = {s:{[id]:need(), [o]:Math.min(prev[o]||0, need()-1)}, w:id}; }
    render(); return;
  }
});
document.addEventListener('change', e=>{
  const ri = e.target.closest('input[data-rec]');
  if(ri){
    const d = cur(), id = ri.dataset.rec, row = ri.closest('.er');
    const w = row.querySelector('[data-f="w"]').value, l = row.querySelector('[data-f="l"]').value;
    d.rec[id] = (w==='' && l==='') ? '' : `${Math.max(0, parseInt(w,10)||0)}-${Math.max(0, parseInt(l,10)||0)}`;
    setTimeout(()=>{
      const f = document.activeElement, keep = f && f.dataset && f.dataset.rec ? [f.dataset.rec, f.dataset.f] : null;
      reseed(); render();
      if(keep){ const n = document.querySelector(`input[data-rec="${keep[0]}"][data-f="${keep[1]}"]`); if(n){ n.focus({preventScroll:true}); try{ n.select(); }catch(_){} } }
    }, 0);
    return;
  }
  const s = e.target.closest('select[data-seed]');
  if(!s) return;
  const d = cur(), c = s.dataset.seed[0], i = +s.dataset.seed.slice(1), id = s.value, old = d.seeds[c][i];
  for(const c2 of ['W','E']){ const j = d.seeds[c2].indexOf(id); if(j>=0 && !(c2===c && j===i)){ d.seeds[c2][j] = old; } }
  d.seeds[c][i] = id;
  render();
});
document.getElementById('year').onchange = e => { state.year = e.target.value; render(); };
document.getElementById('fmt').onchange = e => { state.fmt = e.target.value; render(); };
document.getElementById('dice').onclick = rollSeeding;
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheetK) closeSheet(); });
document.getElementById('edit').onclick = () => { state.edit = !state.edit; render(); };
document.getElementById('real').onclick = () => { const d = cur(); d.seeds = {W:HIST[state.year].W.slice(0,8), E:HIST[state.year].E.slice(0,8)}; d.picks = {}; d.rec = {}; render(); };
document.getElementById('clear').onclick = () => { cur().picks = {}; render(); };
document.getElementById('fit').onclick = () => { state.fit = !state.fit; render(); };
addEventListener('resize', applyFit);
render();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
