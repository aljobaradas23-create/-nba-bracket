<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Playoff Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b13; --card:#121a2b; --card2:#18223a; --line:#26324d;
  --or:#ff7a1a; --or2:#ffa04d; --gold:#ffc94a; --tx:#eef2f8; --mut:#8693ad;
  --gap:28px; --stub:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Barlow',system-ui,sans-serif;color:var(--tx);min-height:100vh;
  background:
    radial-gradient(1200px 500px at 50% -120px, rgba(255,140,40,.18), transparent 70%),
    radial-gradient(800px 600px at 10% 110%, rgba(40,90,200,.12), transparent 70%),
    var(--bg);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}

/* ---------- HEADER ---------- */
header{position:relative;overflow:hidden;border-bottom:3px solid var(--or)}
.wood{position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 46px),
    repeating-linear-gradient(90deg, #c98a4b 0 46px, #c08042 46px 92px, #cf9152 92px 138px),
    #c98a4b;
}
.wood::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,11,19,.55), rgba(8,11,19,.92))}
.court{position:absolute;right:-60px;top:50%;width:260px;height:260px;border:3px solid rgba(255,255,255,.18);border-radius:50%;transform:translateY(-50%)}
.court::after{content:"";position:absolute;inset:80px;border:3px solid rgba(255,255,255,.18);border-radius:50%}
.hin{position:relative;max-width:1500px;margin:0 auto;padding:22px 18px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:56px;height:56px;flex:none;filter:drop-shadow(0 4px 12px rgba(255,122,26,.45));animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kick{font-family:'Barlow Condensed';font-weight:700;letter-spacing:.22em;font-size:12px;color:var(--or2)}
h1{font-family:'Bebas Neue';font-size:44px;line-height:.9;letter-spacing:.02em}
h1 span{color:var(--or)}
.asof{font-size:12px;color:var(--mut);margin-top:3px}
.hctl{margin-left:auto;display:flex;gap:10px;flex:1;max-width:470px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.fld.yr{flex:0 1 190px}
.fld label{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--mut)}
.fld input,.fld select{background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:'Barlow Condensed';font-weight:600;font-size:18px;outline:none;height:46px}
.fld select{font-family:'Bebas Neue';font-size:22px;letter-spacing:.04em;color:var(--gold);border-color:rgba(255,201,74,.45);cursor:pointer}
.fld select option{background:#121a2b;color:var(--tx);font-family:'Barlow Condensed';font-size:16px}
.fld input:focus,.fld select:focus{border-color:var(--or)}
.era{display:inline-block;margin-top:6px;font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.1em;padding:3px 8px;border-radius:6px;background:rgba(255,201,74,.12);color:var(--gold);border:1px solid rgba(255,201,74,.3)}

/* ---------- XP / TOOLBAR ---------- */
.bar{max-width:1500px;margin:0 auto;padding:14px 18px 6px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.xp{flex:1;min-width:230px}
.xpt{display:flex;justify-content:space-between;font-family:'Barlow Condensed';font-weight:700;letter-spacing:.08em;font-size:13px;color:var(--mut);margin-bottom:5px}
.xpt b{color:var(--gold)}
.xpb{height:12px;border-radius:99px;background:#0d1322;border:1px solid var(--line);overflow:hidden}
.xpf{height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--gold));box-shadow:0 0 14px rgba(255,170,60,.6);transition:width .35s ease}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:'Barlow Condensed';font-weight:700;letter-spacing:.06em;font-size:14px;padding:9px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:var(--or)}
.btn.pri{background:var(--or);border-color:var(--or);color:#1a0b00}
.btn.ghost{background:transparent}

/* ---------- TABS ---------- */
.tabs{position:sticky;top:0;z-index:20;background:rgba(8,11,19,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs .in{max-width:1500px;margin:0 auto;padding:8px 12px;display:flex;gap:6px}
.tab{flex:1;font-family:'Bebas Neue';font-size:20px;letter-spacing:.06em;padding:8px 6px 6px;border-radius:10px;color:var(--mut);border:1px solid transparent}
.tab.on{color:var(--tx);background:var(--card2);border-color:var(--line);box-shadow:inset 0 -3px 0 var(--or)}
.desk{display:none}

/* ---------- LAYOUT ---------- */
main{max-width:1500px;margin:0 auto;padding:14px 12px 40px}
.panel{display:none}
main[data-tab="F"] .panel.W, main[data-tab="F"] .panel.E,
main[data-tab="F"] .panel.F, main[data-tab="S"] .panel.S,
main[data-tab="N"] .panel.N, main[data-tab="P"] .panel.P{display:block}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 4px 12px}
.ph h2{font-family:'Bebas Neue';font-size:30px;letter-spacing:.04em}
.panel.W .ph h2{color:#ff9a7a}
.panel.E .ph h2{color:#7ab8ff}
.pc{font-family:'Barlow Condensed';font-weight:700;color:var(--mut);font-size:14px;letter-spacing:.08em}
.sub{font-family:'Barlow Condensed';font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--or2);margin:0 4px 8px;text-transform:uppercase}
.sub small{color:var(--mut);letter-spacing:.06em;font-weight:600;margin-left:6px;text-transform:none}

.pi{background:rgba(255,255,255,.025);border:1px dashed var(--line);border-radius:16px;padding:12px 10px 6px;margin-bottom:16px}
.pigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 10px}

.rlabels{display:flex;gap:var(--gap);padding:0 2px;margin-bottom:4px}
.rlabels span{flex:1 1 0;min-width:0;font-family:'Barlow Condensed';font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--mut);text-transform:uppercase;text-align:center}
.rwrap{overflow:visible;padding-bottom:6px}
/* West | Finals | East — East always on the right, mirrored */
.bscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px 8px;scroll-behavior:auto}
main:not([data-tab="F"]) .bscroll, main:not([data-tab="F"]) .jump{display:none}
.bwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:26px;align-items:start;min-width:1180px}
.panel.F{align-self:center;padding-top:150px}
.panel.E .ph{flex-direction:row-reverse}
.panel.E .rounds, .panel.E .rlabels{flex-direction:row-reverse}
.panel.E .pair::after{right:auto;left:calc(-1 * var(--stub));border-left:2px solid rgba(255,122,26,.45);border-right:0;border-radius:8px 0 0 8px}
.panel.E .pair::before{right:auto;left:calc(-1 * var(--gap))}
.pigrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.rounds .nm, .pigrid .nm{display:none}
.rounds .team, .pigrid .team{grid-template-columns:18px minmax(0,1fr) auto 14px}
.rounds .tbdtxt, .pigrid .tbdtxt{grid-column:2 / 5}
.jump{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
.jump button{font-family:'Barlow Condensed';font-weight:700;letter-spacing:.06em;font-size:14px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.jump button:active{color:var(--tx);border-color:var(--or)}
.fopt{justify-content:flex-start;align-items:flex-start;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--tx);line-height:1.35}
.fopt input{margin-top:3px;flex:none;width:18px;height:18px;accent-color:var(--or)}
.rwrap .rlabels, .rwrap .rounds{min-width:0}
.col, .rlabels span{min-width:0}
.rounds{display:flex;gap:var(--gap);align-items:stretch;padding:0 2px}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-around}
.pair{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.pair::after{content:"";position:absolute;top:25%;bottom:25%;right:calc(-1 * var(--stub));width:var(--stub);border:2px solid rgba(255,122,26,.45);border-left:0;border-radius:0 8px 8px 0;pointer-events:none}
.pair::before{content:"";position:absolute;top:50%;right:calc(-1 * var(--gap));width:calc(var(--gap) - var(--stub));border-top:2px solid rgba(255,122,26,.45);pointer-events:none}

/* ---------- MATCHUP CARD ---------- */
.mu{margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:border-color .2s}
.mu.done{border-color:rgba(255,122,26,.55)}
.mlab{display:flex;align-items:center;gap:5px;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;padding:0 3px 5px;white-space:nowrap;overflow:hidden}
.mlab .res{color:var(--gold)}
.team{width:100%;display:grid;grid-template-columns:18px 42px 1fr auto 14px;align-items:center;gap:6px;height:34px;padding:0 6px 0 4px;border-radius:8px;text-align:left;position:relative;transition:background .2s, opacity .2s, transform .1s}
.team+.team{margin-top:3px}
.team:not(.tbd):hover{background:rgba(255,255,255,.05)}
.team:not(.tbd):active{transform:scale(.98)}
.seed{font-family:'Barlow Condensed';font-weight:700;font-size:13px;color:var(--mut);text-align:center}
.badge{display:inline-flex;align-items:center;justify-content:center;height:24px;border-radius:6px;background:var(--tc);border-bottom:3px solid var(--ts);font-family:'Barlow Condensed';font-weight:700;font-size:13px;letter-spacing:.04em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.nm{font-family:'Barlow Condensed';font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{color:var(--gold);font-weight:700;opacity:0;font-size:14px}
.team.win{background:linear-gradient(90deg, var(--tc) 0%, rgba(18,26,43,0) 92%);box-shadow:inset 3px 0 0 var(--gold)}
.team.win .chk{opacity:1}
.team.win .seed{color:#fff}
.team.lose{opacity:.38}
.team.lose .nm{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.team.tbd{cursor:default}
.tbdtxt{grid-column:2 / 6;font-family:'Barlow Condensed';font-weight:600;font-size:13px;color:#56627c;border:1px dashed #2b3754;border-radius:6px;height:24px;display:flex;align-items:center;padding-left:8px;white-space:nowrap;overflow:hidden}
.gms{display:flex;align-items:center;gap:4px;margin-top:5px;padding:0 2px}
.gms span{font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--mut);margin-right:auto;text-transform:uppercase}
.gm{width:26px;height:22px;border-radius:6px;background:#0c1220;border:1px solid var(--line);font-family:'Barlow Condensed';font-weight:700;font-size:13px;color:var(--mut)}
.gm.on{background:var(--or);border-color:var(--or);color:#1a0b00}
.gm:disabled{opacity:.3;cursor:default}

.ovr{font-family:'Barlow Condensed';font-weight:700;font-size:12px;min-width:24px;text-align:center;padding:1px 4px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--oc);border:1px solid color-mix(in srgb, var(--oc) 45%, transparent)}
.info{margin-left:6px;font-size:12px;line-height:1;padding:2px 4px;border-radius:5px;background:rgba(255,255,255,.06);border:1px solid var(--line);vertical-align:1px}
.info:hover{border-color:var(--or)}
.mlab .ml{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mlab .res{flex:none}
.info{flex:none;margin-left:0}
/* tale of the tape */
.tape{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tside{border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg, color-mix(in srgb, var(--tc) 40%, #0c1220), #0c1220 75%);padding:10px;min-width:0}
.tside.fav{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,201,74,.3)}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.thead .badge{width:44px;flex:none}
.tname{font-family:'Bebas Neue';font-size:22px;line-height:1;letter-spacing:.02em}
.tmeta{font-family:'Barlow Condensed';font-weight:600;font-size:14px;color:#c9d2e3;margin-bottom:6px}
.tmeta b{color:var(--tx)}
.obar{height:8px;border-radius:99px;background:#1b2438;overflow:hidden;margin:2px 0 8px}
.obar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--gold))}
.plist{list-style:none;display:flex;flex-direction:column;gap:3px}
.plist li{display:flex;justify-content:space-between;gap:6px;font-family:'Barlow Condensed';font-weight:600;font-size:15px}
.plist li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist li b{color:var(--gold);flex:none}
.plist li:first-child span::before{content:"⭐ "}
.edge{margin-top:10px;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--gold)}
.tnote{margin-top:8px;font-size:12px;color:var(--mut);text-align:center}
.cstar{font-family:'Barlow Condensed';font-weight:600;font-size:15px;color:var(--gold)}

.sty{flex:none;font-size:12px;line-height:1;padding:2px 4px;border-radius:5px;background:rgba(255,255,255,.06);border:1px solid var(--line);opacity:.75}
.sty.has{opacity:1;border-color:var(--gold);background:rgba(255,201,74,.15)}
.sty:hover{border-color:var(--or)}
.sres{font-family:'Barlow Condensed';font-weight:700;font-size:18px;letter-spacing:.03em;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sres .badge{width:46px;flex:none}
.sres small{color:var(--mut);font-weight:600;letter-spacing:.08em;font-size:12px;text-transform:uppercase;width:100%}
.slab{display:flex;justify-content:space-between;align-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--mut);margin:10px 0 5px;text-transform:uppercase}
.mbox textarea.st{min-height:96px;font:15px/1.5 'Barlow',system-ui,sans-serif}
.mbox textarea.st.fin{min-height:150px;border-color:rgba(255,201,74,.35)}
.aibar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.aibar[hidden]{display:none}
.aibar .btn{font-size:13px;padding:8px 10px}
.aibar select{background:#0c1220;border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-family:'Barlow Condensed';font-weight:600;font-size:14px;color:var(--tx)}
.aist{font-size:12px;color:var(--mut);margin-top:6px;min-height:16px;line-height:1.4}
.aist.err{color:#ff9a9a}
.pstory{margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.pstory h3{font-family:'Bebas Neue';font-size:24px;letter-spacing:.04em;color:var(--gold);margin-bottom:6px}
.psi{padding:10px 0;border-top:1px solid var(--line)}
.psi:first-of-type{border-top:0}
.psh{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed';font-weight:700;font-size:15px;margin-bottom:4px;flex-wrap:wrap}
.psh small{color:var(--mut);letter-spacing:.1em;font-size:11px;text-transform:uppercase}
.psh .badge{width:40px;height:20px;font-size:12px}
.psi p{font-size:14px;line-height:1.55;color:#d6deeb;white-space:pre-wrap}
.psi button{font-family:'Barlow Condensed';font-weight:700;font-size:12px;color:var(--mut);text-decoration:underline;margin-top:4px}

.mu.turn{border-color:var(--or);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,122,26,.3)}}
.mu.turn .ml{color:var(--or2)}
.team.me{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.team.win.me{box-shadow:inset 3px 0 0 var(--gold), inset 0 0 0 1px rgba(255,255,255,.3)}
.myt{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed';font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 10px;white-space:nowrap}
.myt select{background:#0c1220;border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-family:'Barlow Condensed';font-weight:600;font-size:14px;color:var(--tx);max-width:170px}
.gl{border-top:1px solid var(--line);padding:8px 0}
.glh{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed';font-weight:700;font-size:16px}
.glh small{color:var(--mut);font-size:12px;letter-spacing:.06em}
.gsc{margin-left:auto;white-space:nowrap}
.gsc .gw{color:var(--gold)}
.gsc i{color:var(--mut);font-style:normal}
.glh .ser{min-width:46px;text-align:right;color:var(--tx)}
.glp{display:flex;flex-direction:column;font-size:12px;color:#aeb8cc;margin-top:2px;line-height:1.4}
.gle{font-size:13px;color:#d6deeb;margin-top:3px;font-style:italic;line-height:1.4}
.ldrs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ldr{background:#0c1220;border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.ldr>div{display:flex;justify-content:space-between;font-family:'Barlow Condensed';font-weight:600;font-size:14px;gap:6px}
.ldr>div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ldr>div b{color:var(--gold)}
.ldr>.ldh{margin-bottom:4px;align-items:center;justify-content:flex-start;gap:6px}
.ldh .badge{width:40px;height:20px;font-size:12px;flex:none}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-family:'Barlow Condensed';font-weight:600;font-size:16px}
.lrow:first-of-type{border-top:0}
.lrow .badge{width:40px;height:20px;font-size:12px;flex:none}
.lr{width:16px;color:var(--mut)}
.ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg{color:var(--mut);font-size:13px}
.lrow b{color:var(--gold)}

.news{background:#0c1220;border:1px solid rgba(255,201,74,.3);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;color:#e2e8f2;white-space:pre-wrap;max-height:260px;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-family:'Barlow Condensed';font-weight:600;font-size:12px;padding:2px 7px;border-radius:99px;white-space:nowrap;border:1px solid}
.chip i{font-style:normal;opacity:.7}
.chip.ok{color:#a7f3c4;background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3)}
.chip.bad{color:#fca5a5;background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3)}
.tinfo{font-size:14px;padding:4px 6px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--line);align-self:center}
.tinfo:hover{border-color:var(--or)}
.lnk2{margin-top:8px;font-family:'Barlow Condensed';font-weight:700;font-size:13px;color:var(--or2);text-decoration:underline}
.tl{list-style:none;display:flex;flex-direction:column;gap:4px}
.tl li{font-family:'Barlow Condensed';font-weight:600;font-size:16px}
.tl li small{color:var(--mut);font-size:13px;margin-left:4px}
.tl.ok li{color:#a7f3c4}
.tl.bad li{color:#fca5a5}
.srs{display:flex;flex-direction:column;gap:8px}
.sr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.srl{display:flex;flex-direction:column;min-width:0}
.srl b{font-family:'Barlow Condensed';font-weight:700;font-size:15px}
.srl small{font-size:11px;color:var(--mut);line-height:1.3}
.srv{display:flex;align-items:baseline;gap:8px;font-family:'Barlow Condensed';font-weight:700;font-size:17px}
.srv em{font-style:normal;font-size:13px;min-width:30px;text-align:right}
.srb{grid-column:1 / -1;height:5px;border-radius:99px;background:#1b2438;overflow:hidden}
.srb i{display:block;height:100%;border-radius:99px}

.mysb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:#0c1220;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}

function validSeeds(sd){
  if(!sd) return false;
  for(const c of ['W','E']){
    const a = sd[c];
    if(!Array.isArray(a) || a.length!==15 || new Set(a).size!==15 || !a.every(t=>DEFAULT_SEEDS[c].includes(t))) return false;

  return true;
}

}

const _stc = {};

function realSt(id, y){
  const key = y + id;
  if(key in _stc) return _stc[key];
  const s = STATS[y] && STATS[y][id];
  if(!s) return _stc[key] = null;
  const [w, l] = s[0].split('-').map(Number), wp = w/(w+l), srs = Math.max(-10, Math.min(12, s[1]));

}
function st(id, y){

const S = (c,n) => seedsOf(c)[n-1];

function parts(k){
  if(k==='F') return [W('WCF'), W('ECF')];
  const c = k[0], now = isNow();
  switch(k.slice(1)){
    case 'PI1': return [S(c,7), S(c,8)];
    case 'PI2': return [S(c,9), S(c,10)];
    case 'PI3': return [L(c+'PI1'), W(c+'PI2')];

}
function resolve(){

    const p = P[k]; if(!p) continue;
    const t = parts(k);
    if(!t[0] || !t[1] || !t.includes(p.w)) { delete P[k]; continue; }
    if(p.g && !gameOpts(k).includes(p.g)) p.g = null;
  }
  const d = cur();
  if(d.live){ const t = parts(d.live.k) || []; if(PK()[d.live.k] || !t[0] || !t[1] || !d.live.games) d.live = null; }

}

/* ================= SIMULATION ================= */
function eraBase(y){ y = +y; return y>=2027 ? 115 : y<=1990 ? 108 : y<=1994 ? 104 : y<=1998 ? 97 : y<=2004 ? 94 : y<=2011 ? 98 : 100; }

  const da = seedOf(a), db = seedOf(b);
  if(da.c===db.c) return da.s<=db.s ? a : b;
  const sa = st(a), sb = st(b);
  if(sa && sb){ const wp = s => { const [w,l] = s.r.split('-').map(Number); return w/(w+l); }; return wp(sa)>=wp(sb) ? a : b; }
  return a;
}
function expect(home, away){
  const sh = st(home), sa = st(away), ah = adv(home), aa = adv(away), q = QF();
  let base = eraBase(state.year), mu = 0.7*((sh ? sh.ovr : 75) - (sa ? sa.ovr : 75)) + 3;
  let eh = base + mu/2, ea = base - mu/2;
  if(ah && aa){
    const lg = ah.lg[0], poss = (ah.v[2] + aa.v[2])/2;
    const rh = poss*(ah.v[0] + aa.v[1] - lg)/100 + 1.5, ra = poss*(aa.v[0] + ah.v[1] - lg)/100 - 1.5;
    const m2 = isNow() && !ficFake() ? 0.5*(rh-ra) + 0.5*mu : 0.6*(rh-ra) + 0.4*mu;
    const tot = rh + ra; eh = (tot + m2)/2; ea = (tot - m2)/2;

function playerPts(id, score, exp){
  const s = st(id); if(!s) return null; const q = QF();
  let pts = s.pl.map(x => Math.max(0, Math.round(x.p*q*(score/Math.max(1, exp)) + randn()*(0.2*x.p*q + 1.5))));
  const sum = pts.reduce((a,b)=>a+b, 0), cap = Math.max(3, score - Math.round(10*q));
  if(sum > cap) pts = pts.map(v => Math.max(0, Math.round(v*cap/sum)));
  return pts;
}
function simGame(home, away, mustWin){
  const q = QF(), {eh, ea} = expect(home, away);
  const sd = 11*Math.sqrt(q);
  let m = 0, tries = 0;
  do { m = Math.round((eh-ea) + randn()*sd); tries++; }
  while(tries < 40 && (m===0 || (mustWin===home && m<0) || (mustWin===away && m>0)));
  if(mustWin===home && m<=0) m = rint(1, Math.max(2, Math.round(6*q)));
  if(mustWin===away && m>=0) m = -rint(1, Math.max(2, Math.round(6*q)));

  if(Math.abs(m)<=Math.max(1, Math.round(2*q)) && Math.random()<0.35) ot = Math.random()<0.85 ? 1 : 2;
  const total = Math.round(eh + ea + randn()*10*Math.sqrt(q)) + ot*Math.round(rint(9,14)*q);

function mkGame(home, away, hs, as, ot, eh, ea){

function gameEvent(g, total, need, last, single){

    games.forEach(g => { gw(g)===w ? a++ : b++; if(b - a > maxDown){ maxDown = b - a; downAt = `${a}-${b}`; } });
    const flow = [];
    const g1 = games[0], t1 = topOf(g1, gw(g1));
    flow.push(`In Game 1, ${gw(g1)===w ? `the ${Tw.n} struck first` : `the ${Tl.n} drew first blood`}, ${sc(g1)}${t1 ? `, led by ${t1.n} (${t1.p} pts)` : ''}.`);
    const notes = [];
    games.forEach((g, i) => {
      if(i===0 || i===games.length-1) return;
      const winr = TEAMS[gw(g)].n, tp = topOf(g, gw(g)), mg = Math.abs(g.hs-g.as), q = (g.q||12)/12;
      if(g.ot) notes.push(`Game ${i+1} needed ${g.ot===2?'double overtime':'overtime'} before the ${winr} pulled it out, ${sc(g)}.`);
      else if(mg>=Math.round(20*q)) notes.push(pick1([`Game ${i+1} was a blowout — the ${winr} ran away with it, ${sc(g)}.`, `There was no contest in Game ${i+1}: ${sc(g)} in favor of the ${winr}.`]));
      else if(mg<=Math.max(2,Math.round(3*q))) notes.push(`Game ${i+1} was a nail-biter, and the ${winr} escaped ${sc(g)}${tp ? ` thanks to clutch play from ${tp.n}` : ''}.`);
      for(const id of [g.h, g.a]){ const t = topOf(g, id); if(t && t.p>=Math.round(40*q)) notes.push(`${t.n} erupted for ${t.p} points in Game ${i+1}.`); }
    });
    flow.push(...notes.slice(0, 3));
    if(maxDown>=2) flow.push(`The ${Tw.n} fell behind ${downAt} in the series — but they refused to fold and clawed their way back.`);
    else if(b===0) flow.push(`The ${Tl.n} never won a game — the ${Tw.n} dominated from start to finish.`);
    else if(maxDown===1) flow.push(`The ${Tw.n} trailed briefly in the series but answered quickly.`);
    out.push(flow.join(' '));
    const gl = games[games.length-1], tc = topOf(gl, w), n = games.length, full = n===gameOpts(k)[gameOpts(k).length-1];
    let close = full
      ? `It went the distance — Game ${n}, winner-take-all. ${gl.ot ? 'It took overtime, but ' : ''}the ${Tw.n} survived, ${sc(gl)}, ${where(gl, w)}.`
      : `In Game ${n}, the ${Tw.n} closed out the series, ${sc(gl)}, ${where(gl, w)}${gl.ot ? ' after overtime' : ''}.`;
    if(tc) close += ` ${tc.n} was the hero of the clincher with ${tc.p} points.`;
    const lw = seriesLeaders(k, w), ll = seriesLeaders(k, l);
    if(lw[0]) close += ` For the series, ${lw[0].n} led the ${Tw.n} (${lw[0].a.toFixed(1)} PPG)${ll[0] ? `, while ${ll[0].n} was the ${Tl.n}' top performer (${ll[0].a.toFixed(1)} PPG)` : ''}.`;
    out.push(close);
  }
  out.push(nx ? `With the win, the ${Tw.n} ${nx.w}, while the ${Tl.n} ${nx.l}.`
              : `At the final buzzer, the ${Tw.c} ${Tw.n} are the ${y} NBA Champions! 🏆${seriesLeaders(k, w)[0] ? ` Amid the confetti, ${seriesLeaders(k, w)[0].n} is the face of the title run.` : ''}`);
  return out.join('\n\n');
}

    {label:'Delete', cls:'ghost', fn:()=>{ delete p.n; delete p.s; p.auto = 0; p.noAuto = 1; save(); toast('🗑️ Story deleted'); }},
    {label:'Save', cls:'pri', fn:()=>{ toast('💾 Story saved!'); }}
  ], ()=>{ if(busy) busy.abort(); save(); render(); });
  const $ = id => document.getElementById(id);
  const orig = $('s-orig'), fin = $('s-fin'), stt = $('aist');
  const cnt = () => { const n = fin.value.trim().split(/\s+/).filter(Boolean).length; $('s-cnt').textContent = n ? n + ' words' : ''; };
  cnt();
  orig.addEventListener('input', ()=>{ p.n = orig.value; save(); });
  fin.addEventListener('input', ()=>{ p.s = fin.value; p.auto = 0; save(); cnt(); });
  const src = () => orig.value.trim() || fin.value.trim();
  const need = () => { if(src()) return true; stt.className = 'aist err'; stt.textContent = 'Write a short description in "Your notes" first.'; orig.focus(); return false; };
  $('of-ex').onclick = () => { if(!need()) return; fin.value = p.s = expandOffline(k, orig.value); p.auto = 0; save(); cnt(); stt.className = 'aist'; stt.textContent = '📝 Built offline from team stats. Tap again for another version.'; };
  $('cp-pr').onclick = () => { if(need()) copyText(aiPrompt(k, 'expand', src()), '📋 Prompt copied! Paste it into Claude'); };
  const run = async (mode) => {
    if(!AI || !need()) return;
    if(busy) busy.abort();
    const ctl = busy = new AbortController();
    const btns = [$('ai-rw'), $('ai-ex')]; btns.forEach(b=>b.disabled = true);
    stt.className = 'aist'; stt.textContent = mode==='expand' ? '✍️ Expanding...' : '✨ Rewording...';
    try{
      const r = await AI(aiPrompt(k, mode, src()), {signal: ctl.signal, onText: ({text}) => { fin.value = text; cnt(); }});
      fin.value = p.s = r.text.trim(); p.auto = 0; save(); cnt(); stt.textContent = '✅ Done! Edit it however you like.';
    }catch(e){
      if(ctl.signal.aborted) return;
      stt.className = 'aist err';
      stt.textContent = e && e.code==='rate_limited' ? 'Too many requests — try again in a bit.' : e && e.code==='not_granted' ? 'AI was not allowed. Use offline or Copy AI prompt.' : 'The AI hit an error. Try again or use offline.';
      if(e && e.code==='not_granted'){ AI = null; $('aiwrap').hidden = true; }
    }finally{ btns.forEach(b=>{ if(b) b.disabled = false; }); if(busy===ctl) busy = null; }
  };
  $('ai-rw').onclick = () => run('reword'); $('ai-ex').onclick = () => run('expand');
}

/* ---------- MY TEAM: enter the score ---------- */
function myModal(k){
  const t = parts(k); if(!t[0] || !t[1]) return;
  const m = myTeam(), opp = t[0]===m ? t[1] : t[0], p = PK()[k];
  const single = !isSeries(k), need = single ? 1 : gameOpts(k)[0];
  const home = homeOf(t[0], t[1]), away = home===t[0] ? t[1] : t[0], pat = patOf(need), d = cur();
  let games;
  if(p){ ensureSim(k); games = p.sim.games; }
  else {
    if(!d.live || d.live.k!==k){ d.live = {k, games:[]}; newsPreview(k); save(); }
    games = d.live.games;
  }
  const wins = {[m]:0, [opp]:0};
  games.forEach(g => { wins[g.hs>g.as ? g.h : g.a]++; });
  const done = wins[m]>=need || wins[opp]>=need;
  const fmtTxt = single ? 'Single game — win or go home' : `Best-of-${need*2-1} · first to ${need} wins advances`;
  const ln = (g, id) => { const s = st(id), pts = g.pl[id]; return s && pts ? s.pl.map((x,j)=>`${esc(lastName(x.n))} ${pts[j]}`).join(' · ') : ''; };
  const rows = games.map((g, i) => {
    const gw = g.hs>g.as ? g.h : g.a, me = gw===m;
    return `<div class="gl"><div class="glh"><b>${single ? 'Game' : 'G'+(i+1)}</b><small>@${AB(g.h)}${g.ot ? ' · OT' : ''}</small>
      <span class="gsc"><span class="${gw===g.a?'gw':''}">${AB(g.a)} ${g.as}</span> <i>–</i> <span class="${gw===g.h?'gw':''}">${AB(g.h)} ${g.hs}</span></span>
      <span class="wl ${me?'w':'l'}">${me?'W':'L'}</span></div>
      <div class="glp"><span>${AB(m)}: ${ln(g, m)}</span><span>${AB(opp)}: ${ln(g, opp)}</span></div>
      <div class="gle">${esc(g.ev||'')}</div>
      <textarea class="st grep" data-gi="${i}" maxlength="2000" placeholder="Your Game ${single ? '' : i+1} report — what happened? Key plays, who stepped up, the turning point...">${esc(g.r||'')}</textarea></div>`;
  }).join('');
  const n = games.length, nextHome = pat[n]===0 ? home : away, nextAway = nextHome===home ? away : home;
  const ex = expect(nextHome, nextAway), exM = Math.round(m===nextHome ? ex.eh : ex.ea), exO = Math.round(m===nextHome ? ex.ea : ex.eh);
  const banner = done
    ? (wins[m]>=need ? `<div class="mybn win">🏆 ${esc(TEAMS[m].n.toUpperCase())} ADVANCE! ${single ? '' : `${wins[m]}-${wins[opp]}`}</div>`
                     : `<div class="mybn lose">❌ ${esc(TEAMS[m].n)} eliminated${single ? '' : ` ${wins[m]}-${wins[opp]}`} — season over</div>`)
    : `<div class="mynext"><div class="mynq">${single ? 'The game' : `Game ${n+1}`} · @${AB(nextHome)} · ${qlen()}-min quarters — enter the final score</div>
        <div class="scin">
          <label>${badge(m)}<span>${esc(TEAMS[m].n)}</span><input id="sc-m" type="number" inputmode="numeric" min="0" max="300" placeholder="${exM}"></label>
          <i>–</i>
          <label>${badge(opp)}<span>${esc(TEAMS[opp].n)}</span><input id="sc-o" type="number" inputmode="numeric" min="0" max="300" placeholder="${exO}"></label>
        </div>
        <label class="otc"><input type="checkbox" id="sc-ot"> Went to overtime</label>
        <div class="mybtns"><button class="btn wbtn" id="sc-save">💾 Save ${single ? 'game' : 'Game '+(n+1)}</button><button class="btn ghost" id="sc-sim">🎲 Sim it</button></div>
        <div class="aist" id="sc-msg"></div></div>`;
  const sumBox = done && !single ? `<div class="slab"><span>Your series summary</span></div><textarea class="st" id="my-sum" maxlength="3000" placeholder="Wrap up the series in your own words...">${esc((p && p.sum) || '')}</textarea>` : '';
  openModal(`🎮 ${roundName(k)}`, `
    <div class="sres"><small>${state.year}${ficOn() ? ' · Fictional' : ''} · ${fmtTxt}</small></div>
    <div class="mysb"><div class="mys">${badge(m)}<span>${esc(TEAMS[m].n)}</span><b>${wins[m]}</b></div><i>vs</i><div class="mys">${badge(opp)}<span>${esc(TEAMS[opp].n)}</span><b>${wins[opp]}</b></div></div>
    ${banner}${rows}${sumBox}
    ${!n ? `<div class="tnote">Play your ${qlen()}-minute-quarter game, then enter the final score for both teams. Player points are estimated from each team's scorers. Placeholders show the expected score. A preview just dropped in 📰 News.</div>` : ''}
    ${done ? `<div class="aibar"><button class="btn" id="my-print">🖨️ Print series report</button><button class="btn ghost" id="my-run">🖨️ Full playoff run</button></div>` : ''}
  `, done ? [
    {label:'🔄 Redo series', cls:'ghost', fn:()=>{ delete PK()[k]; d.live = null; dropMedia(k); resolve(); save(); setTimeout(()=>myModal(k), 30); }},
    {label:'▶ Continue sim', cls:'pri', fn:()=>{ setTimeout(()=>runSim(true), 60); }}
  ] : [
    ...(n ? [{label:'↩️ Undo', cls:'ghost', fn:()=>{ games.pop(); dropMedia(k, games.length); save(); setTimeout(()=>myModal(k), 30); }}] : []),
    {label:'Close', cls:'ghost'}
  ], ()=>{ if(PK()[k]) refreshMyStory(k); save(); render(); });
  document.querySelectorAll('#mbody .grep').forEach(ta => ta.addEventListener('input', () => { games[+ta.dataset.gi].r = ta.value; if(PK()[k]) refreshMyStory(k); save(); }));
  const sm = document.getElementById('my-sum');
  if(sm) sm.addEventListener('input', () => { PK()[k].sum = sm.value; refreshMyStory(k); save(); });
  if(done){ document.getElementById('my-print').onclick = () => openReport([k]); document.getElementById('my-run').onclick = () => openReport(myKeys()); return; }
  const finish = g => {
    games.push(g);
    const gw = g.hs>g.as ? g.h : g.a; wins[gw]++;
    const last = wins[m]>=need || wins[opp]>=need;
    g.ev = gameEvent(g, games.length, need, last, single);
    newsGame(k, games.length-1, games, true);
    if(ficFake()) pressGame(k, games.length-1, games);
    if(last){
      const w = wins[m]>=need ? m : opp, l = w===m ? opp : m;
      PK()[k] = {w, g: single ? null : games.length, sim:{w, l, games: games.slice()}};
      d.live = null; resolve(); refreshMyStory(k); mediaForSeries(k);
      if(k==='F' && w===m) setTimeout(celebrate, 200);
    }
    save(); myModal(k);
    setTimeout(()=>{ const ta = document.querySelector(`#mbody .grep[data-gi="${games.length-1}"]`); if(ta){ ta.scrollIntoView({block:'center'}); ta.focus({preventScroll:true}); } }, 60);
  };
  document.getElementById('sc-save').onclick = () => {
    const a = parseInt(document.getElementById('sc-m').value, 10), b = parseInt(document.getElementById('sc-o').value, 10), msg = document.getElementById('sc-msg');
    msg.className = 'aist err';
    if(isNaN(a) || isNaN(b) || a<0 || b<0){ msg.textContent = 'Enter a score for both teams.'; return; }
    if(a===b){ msg.textContent = 'No ties — if it went to overtime, enter the final score after OT.'; return; }
    const ot = document.getElementById('sc-ot').checked ? 1 : 0;
    const hs = m===nextHome ? a : b, as = m===nextHome ? b : a;
    finish(mkGame(nextHome, nextAway, hs, as, ot));
  };
  document.getElementById('sc-sim').onclick = () => finish(simGame(nextHome, nextAway, null));
  setTimeout(()=>{ const i = document.getElementById('sc-m'); if(i) i.focus({preventScroll:true}); }, 80);
}

function openReport(keys){

  const html = reportHTML(keys), m = myTeam(), fname = `${state.year}-${m ? TEAMS[m].n.replace(/\s+/g,'-') : 'playoffs'}-report.html`;
  let ov = document.getElementById('rpov');
  if(!ov){ ov = document.createElement('div'); ov.id = 'rpov'; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="rpbar"><b>🖨️ Report preview</b><span><button class="btn pri" id="rp-print">🖨️ Print</button><button class="btn" id="rp-dl">⬇️ Download</button><button class="btn ghost" id="rp-x">Close</button></span>
    <small>If Print doesn't open here, tap Download, open the file, then print or save as PDF.</small></div><iframe id="rpf" title="Report"></iframe>`;
  ov.hidden = false;
  const fr = document.getElementById('rpf'); fr.srcdoc = html;
  document.getElementById('rp-x').onclick = () => { ov.hidden = true; };
  document.getElementById('rp-print').onclick = () => { try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ try{ window.print(); }catch(_){ toast('Printing is blocked here — use Download'); } } };
  document.getElementById('rp-dl').onclick = async () => {
    if(DL){ try{ await DL.save({filename: fname, data: html}); toast('⬇️ Report saved'); return; }catch(e){ if(e && e.code==='declined') return; } }
    try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], {type:'text/html'})); a.download = fname; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
    catch(e){ toast('Download blocked here'); }
  };
}

/* ================= EVENTS ================= */
document.addEventListener('click', e=>{
  const tmb = e.target.closest('[data-team]');
  if(tmb){ teamModal(tmb.dataset.team); return; }
  const sb = e.target.closest('[data-story]');
  if(sb){ storyModal(sb.dataset.story); return; }
  const inf = e.target.closest('.info[data-info]');
  if(inf){ const k = inf.dataset.info; if(!PK()[k] && involvesMy(k)) myModal(k); else PK()[k] ? seriesModal(k) : tape(k); return; }
  const tm = e.target.closest('.team[data-k]');
  if(tm){ const k = tm.dataset.k; if(involvesMy(k)) myModal(k); else pick(k, tm.dataset.t); return; }
  const turn = e.target.closest('.mu.turn');
  if(turn && !e.target.closest('button')){ myModal(turn.dataset.mk); return; }
  const gm = e.target.closest('.gm[data-g]');
  if(gm){ const k = gm.dataset.k; if(involvesMy(k)){ myModal(k); return; } const p = PK()[k]; if(p){ const g = +gm.dataset.g; p.g = p.g===g ? null : g; delete p.sim; autoWrite(k); dropMedia(k); mediaForSeries(k); save(); render(); } return; }
  const nf = e.target.closest('[data-nf]');
  if(nf){ state.nf = nf.dataset.nf; save(); render(); return; }
  const tb = e.target.closest('.tab');
  const jb = e.target.closest('[data-jump]');
  if(jb){ const bs = document.getElementById('bscroll'), pn = document.querySelector('#bwrap .panel.'+jb.dataset.jump);
    if(bs && pn) bs.scrollTo({left: Math.max(0, pn.offsetLeft - (bs.clientWidth - pn.offsetWidth)/2), behavior:'smooth'}); return; }
  if(tb){ state.tab = tb.dataset.tab; save(); render(); window.scrollTo({top: Math.min(scrollY, document.querySelector('.tabs').offsetTop), behavior:'smooth'}); return; }
  const ac = e.target.closest('[data-act]');
  if(!ac) return;
  switch(ac.dataset.act){
    case 'copy': copyText(summary(), '📋 Bracket copied! Paste it anywhere'); break;
    case 'sim1': runSim(false); break;
    case 'simall': runSim(true); break;
    case 'fic': ficModal(); break;
    case 'code': codeModal(); break;
    case 'myreport': openReport(myKeys()); break;
    case 'reveal': cur().rev = !cur().rev; save(); render(); break;
    case 'reset': openModal(`Reset ${state.year} bracket?`, `<p>This clears all your ${state.year} picks, stories, news and press conferences${ficOn() ? ' (your fictional league stays)' : ''}. Other seasons aren't touched.</p>`, [
        {label:'Cancel', cls:'ghost'},
        {label:'Yes, reset', cls:'pri', fn:()=>{ const d = cur(), my = d.my; resetSeason(); d.my = my; save(); render(); toast('↺ Bracket reset'); }}
      ]); break;
    case 'seedreset': cur().seeds = clone(DEFAULT_SEEDS); resolve(); save(); render(); toast('Seeding reset to standings'); break;
  }
});
document.addEventListener('change', e=>{
  const id = e.target.id;
  if(id==='year'){ state.year = e.target.value; cur(); resolve(); for(const k of ORDER()) if(PK()[k]) autoWrite(k); save(); render(); toast(isNow() ? '🏀 Current season (2026–27)' : `📼 Throwback: ${state.year} playoffs`); return; }
  if(id==='fmt'){ state.fmt = e.target.value; resolve(); for(const k of ORDER()) if(PK()[k]) autoWrite(k); cur().live = null; save(); render(); toast(state.fmt==='bo5' ? '🏆 Best-of-5: first to 3 wins advances' : '🏆 Original format'); return; }
  if(id==='qlen'){ state.qlen = +e.target.value; save(); render(); toast(`⏱ ${state.qlen}-minute quarters — new games use this length`); return; }
  if(id==='myteam'){ cur().my = e.target.value; save(); render(); toast(e.target.value ? `🎮 The ${TEAMS[e.target.value].n} are your team — you'll enter their scores` : 'No team selected — everything simulates'); return; }
  const s = e.target.closest('select[data-c]'); if(!s || !isNow() || ficOn()) return;
  const c = s.dataset.c, i = +s.dataset.i, t = s.value, arr = cur().seeds[c], j = arr.indexOf(t);
  if(j>=0 && j!==i){ [arr[i], arr[j]] = [arr[j], arr[i]]; }
  resolve(); save(); render();
});
document.addEventListener('input', e=>{
  if(e.target.id==='name'){ state.name = e.target.value; save(); }
  if(e.target.id==='mvp'){ cur().mvp = e.target.value; save(); }
});
document.getElementById('name').value = state.name;
render();

</script>
</body>
</html>
